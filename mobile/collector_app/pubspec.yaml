name: ecotrace_collector
description: EcoTrace India — Collector mobile application (P6.3). Device capture, registration, and offline-first submission for e-waste collectors.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Networking
  dio: ^5.11.0

  # Secure token storage (never plaintext — see docs/engineering/09_BLOCKCHAIN.md security notes)
  flutter_secure_storage: ^11.0.0

  # Offline-first local persistence (device cache + sync queue)
  sqflite: ^2.4.3
  path: ^1.9.0
  path_provider: ^2.1.6

  # Camera / gallery capture
  image_picker: ^1.2.3

  # QR / barcode scanning
  mobile_scanner: ^7.4.0

  # Connectivity awareness for the sync manager
  connectivity_plus: ^7.3.1

  # Idempotency keys for queued submissions
  uuid: ^4.6.0

  # Date/number formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  # sqflite testing on a plain Dart VM (no Android/iOS platform channel)
  # requires the native sqlite3 library on the machine running `flutter test`
  # — see test/unit/sync_queue_repository_test.dart.
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/
