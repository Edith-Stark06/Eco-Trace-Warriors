name: ecotrace_consumer
description: EcoTrace India — Consumer mobile application (P6.4). Report e-waste for pickup, track rewards, verify devices.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (same pinned major version as the Collector app —
  # see reports/P6_3_MOBILE_COLLECTOR.md §8 for the Notifier/NotifierProvider
  # API this version actually exposes).
  flutter_riverpod: ^3.4.2

  # Networking
  dio: ^5.11.0

  # Secure token storage
  flutter_secure_storage: ^11.0.0

  # QR/barcode scanning (features/scan)
  mobile_scanner: ^7.4.0

  # Date formatting
  intl: ^0.20.3

  # X-Request-ID correlation header (core/network/api_client.dart)
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/
