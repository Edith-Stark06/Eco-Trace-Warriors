# Optional HTTPS variant of nginx.conf (P9.1) — used only when
# docker-entrypoint-tls.sh finds a mounted certificate at container
# startup. Plain HTTP on 80 redirects to HTTPS; HTTPS on 443 serves the
# same SPA as nginx.conf's default HTTP-only server block.
#
# The certificate at /etc/nginx/tls/tls.crt + tls.key is self-signed and
# local/demo only by default (deployment/tls/generate_local_cert.sh) — a
# real deployment mounts a real CA-issued certificate at the same two
# paths, no other configuration change needed.

server {
    listen 80;
    server_name _;
    # __TLS_PORT__ is substituted by docker-entrypoint-tls.sh at container
    # startup with the host-mapped HTTPS port (docker-compose.yml's
    # FRONTEND_TLS_PORT, default 8443 — a non-standard port, matching this
    # project's convention of avoiding privileged/conflicting ports for
    # local dev). Omitting the port here would silently redirect to the
    # default HTTPS port 443, which is not what is actually mapped.
    return 301 https://$host:__TLS_PORT__$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
