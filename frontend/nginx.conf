# Static SPA server for the built Vite bundle (P7.5).
# React Router uses client-side routing — every non-file path must fall
# back to index.html or a hard refresh on e.g. /admin/submissions 404s.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets (Vite fingerprints every filename).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
