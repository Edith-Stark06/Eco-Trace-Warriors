# Static SPA server for the built Vite bundle (P7.5).
# React Router uses client-side routing — every non-file path must fall
# back to index.html or a hard refresh on e.g. /admin/submissions 404s.
#
# This is the default, HTTP-only config — unchanged from P7.5. Optional
# TLS (P9.1) is a separate template, `nginx.tls.conf`, selected at
# container startup by `docker-entrypoint-tls.sh` only when a certificate
# is actually mounted — see that script for why this file must keep
# working standalone with zero TLS configuration.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets (Vite fingerprints every filename).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
