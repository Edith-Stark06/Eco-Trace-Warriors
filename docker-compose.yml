services:
  postgres:
    image: postgres:16

    container_name: ecotrace-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ecotrace
      POSTGRES_PASSWORD: ecotrace123
      POSTGRES_DB: ecotrace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: