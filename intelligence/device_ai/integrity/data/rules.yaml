# Device-passport validation rule-set for the Validation & Integrity Engine (M2.4).
#
# This file is DATA, not code: it declares the VALIDATION CONTRACT the integrity
# engine re-checks every DevicePassport (M2.3) against before hashing it — which
# sections a passport must contain, the kind of each section (a string, an object
# with a fixed set of fields, or an ordered array), which numeric fields are
# normalized confidences that must fall in [0, 1], and which sections are required
# versus optional. It can be reviewed and versioned independently of the passport
# schema as the passport structure evolves, without touching the validator. A
# strict loader (integrity/rules.py) validates this file on load and raises a
# typed PassportIntegrityRuleError on any structural problem.
#
# The integrity engine is a CHECKER, not an assembler: it consumes a passport the
# pipeline already produced, reports its structural soundness as ordered errors
# and warnings (a malformed passport is REPORTED, never raised), and stamps a
# deterministic SHA-256 hash over the passport's canonical serialization so any
# later mutation is detectable. This rule-set therefore describes shape, ranges
# and required/optional only; it holds no scoring weights, thresholds or policy.
#
# Top-level keys
#   version   Semantic version string, stamped onto every produced report as its
#             rules_version.
#   sections  Mapping of section name -> { kind, [fields], [confidence_fields],
#             [required] }. Order here is the order sections are checked and
#             reported in.
#
# A section's `kind` is one of:
#   string    a plain string value (e.g. the passport id).
#   object    a mapping that must contain every name in its `fields` list.
#   array     an ordered list (e.g. reasoning, warnings).
#
# `confidence_fields` (object sections only) names the subset of `fields` whose
# values must be numeric and within [0, 1]; anything else is reported as an error.
# `required` (default true) marks a section as mandatory: a missing required
# section is an error (the passport is invalid); a missing optional section is a
# soft warning (the passport stays valid-with-warnings).

version: "1.0.0"

sections:
  # --- Identity & version -------------------------------------------------
  passport_id:
    kind: string

  passport_version:
    kind: string

  eco_id:
    kind: string

  # --- Composed sections --------------------------------------------------
  device_identity:
    kind: object
    fields:
      - brand
      - model
      - serial_number
      - imei
      - mac_address

  classification:
    kind: object
    fields:
      - device_type
      - confidence
      - has_conflicts
    confidence_fields:
      - confidence

  decision_summary:
    kind: object
    fields:
      - recommended_action
      - priority
      - confidence
      - winning_rule_id
      - triggered_count
    confidence_fields:
      - confidence

  material_summary:
    kind: object
    fields:
      - material_count
      - total_mass_g
      - recoverable_mass_g
      - hazardous_mass_g
      - confidence
    confidence_fields:
      - confidence

  environmental_summary:
    kind: object
    fields:
      - carbon_saved_kg
      - energy_saved_mj
      - water_saved_l
      - landfill_diversion_kg
      - critical_material_recovery_kg
      - circularity_index
      - hazard_reduction_score
      - confidence
    confidence_fields:
      - circularity_index
      - hazard_reduction_score
      - confidence

  # The fingerprint anchor is optional evidence, not a required identity: a
  # passport built without a DeviceFingerprint carries an all-empty (still
  # structurally valid) fingerprint_summary. When the section is present it must
  # still satisfy its field contract.
  fingerprint_summary:
    kind: object
    required: false
    fields:
      - fingerprint
      - dimension
      - encoder_name
      - encoder_version
      - metric

  confidence_summary:
    kind: object
    fields:
      - identity_confidence
      - decision_confidence
      - material_confidence
      - environmental_confidence
      - overall
    confidence_fields:
      - identity_confidence
      - decision_confidence
      - material_confidence
      - environmental_confidence
      - overall

  metadata:
    kind: object
    fields:
      - passport_engine_version
      - schema_version
      - fusion_engine_version
      - decision_engine_version
      - decision_rules_version
      - material_engine_version
      - material_profile_version
      - environmental_engine_version
      - environmental_factors_version
      - source_image_count
      - created_at

  # --- Ordered narrative --------------------------------------------------
  reasoning:
    kind: array

  warnings:
    kind: array
