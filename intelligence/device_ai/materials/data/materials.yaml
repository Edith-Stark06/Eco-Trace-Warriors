# Material profile catalogue for the Material Intelligence Engine (M1.10).
#
# This file is DATA, not code: it holds the versioned, per-device-type material
# knowledge the engine estimates recoverable materials from. It can be reviewed,
# extended or corrected without touching the engine. A strict loader
# (materials/profiles.py) validates every entry on load and rejects anything
# malformed, so a bad catalogue never silently degrades the engine.
#
# Top-level keys
#   version   Semantic version string, stamped onto every produced report.
#   aliases   Synonym -> canonical device-type map. Keys and values are
#             normalized on load (internal whitespace -> "_", casefolded).
#   unknown   Conservative fallback profile for unrecognized device types.
#             Its materials should be generic and unconditional (structural).
#   profiles  Canonical device-type -> profile. Each profile has an optional
#             'notes' string and a 'materials' list (>= 1 entry).
#
# Material entry fields
#   name              Human-readable material name (required, non-empty).
#   category          One of the MaterialCategory wire values (required):
#                     ferrous_metal, non_ferrous_metal, precious_metal,
#                     critical_material, rare_earth, plastic, glass, ceramic,
#                     battery_material, hazardous, other.
#   mass_g            Nominal mass in grams (required, >= 0). Never scaled by
#                     confidence; confidence is a separate, independent axis.
#   recoverable       Whether the material carries recovery value (default true).
#   hazardous         Whether the material needs hazardous handling (default
#                     false).
#   source_components Component-category wire values (from the M1.9 component
#                     report) whose presence conditions this material and drives
#                     its confidence. Allowed: battery, circuit_board, processor,
#                     memory, storage, display, connectivity, input, camera,
#                     sensor, power, audio, optics, optical_media, cabling,
#                     housing, other. Omit / leave empty for an unconditional
#                     structural material (always present at full source weight).
#   notes             Optional short rationale (provenance; not used in scoring).

