unknown:
  notes: >-
    Unrecognized device type. Only generic materials common to most electronics
    are estimated, unconditionally and at conservative mass; a human should
    confirm the device before acting on this breakdown.
  materials:
    - name: Mixed plastics (enclosure)
      category: plastic
      mass_g: 150.0
      hazardous: false
      recoverable: true
      notes: Almost every device has a plastic or metal enclosure.
    - name: Mixed ferrous metal
      category: ferrous_metal
      mass_g: 80.0
      hazardous: false
      recoverable: true
      notes: Generic steel fasteners, shielding and brackets.
    - name: Mixed circuit-board material
      category: other
      mass_g: 40.0
      hazardous: false
      recoverable: true
      notes: Generic populated board assumption for an unknown powered device.

