# =============================================================================
# Component Intelligence Engine — external component-profile library (M1.9)
# =============================================================================
#
# This file is the single, versioned source of truth for the component
# knowledge the engine infers from. It is deliberately stored *outside* the
# Python code (unlike the M1.8 recoverability profile table) so the component
# catalogue can be reviewed, extended or corrected without a code change or a
# redeploy of the engine logic — the loader validates it on read.
#
# Schema
# ------
# version:   Semantic version of this catalogue (stamped onto every report as
#            profile provenance).
# aliases:   Map of synonym -> canonical device type, so heterogeneous module
#            labels ("cell phone", "PC", "CRT") resolve to one profile. Keys and
#            values are normalized (whitespace -> "_", casefolded) on load.
# unknown:   The conservative fallback profile used for any device type not in
#            `profiles` (generic, low-likelihood components + a review warning).
# profiles:  Map of canonical device type -> profile. Each profile has optional
#            `notes` and a list of `components`.
#
# Component fields
# ----------------
# name:            Human-readable component name (shown in the report).
# category:        One of the ComponentCategory wire values (see models.py).
# base_likelihood: Prior probability in [0, 1] that a device of this class
#                  contains this component, before any evidence is applied.
# hazardous:       Whether the component needs hazardous handling (batteries,
#                  CRT leaded glass, backlight lamps).
# recoverable:     Whether the component carries meaningful reuse/material value.
# implied_by:      Optional list of identity signals whose presence in the fused
#                  context corroborates this component and boosts its presence
#                  confidence. Allowed: model, serial_number, imei, mac_address.
# notes:           Optional short rationale (provenance; not used in scoring).
# =============================================================================

