unknown:
  notes: >-
    Unrecognized device type. Only generic components common to most electronics
    are inferred, at low likelihood; a human should confirm the device before
    acting on this component list.
  components:
    - name: Outer enclosure / housing
      category: housing
      base_likelihood: 0.80
      hazardous: false
      recoverable: true
      notes: Almost every device has a plastic or metal enclosure.
    - name: Printed circuit board
      category: circuit_board
      base_likelihood: 0.70
      hazardous: false
      recoverable: true
      notes: Generic board assumption for an unknown powered device.
    - name: Internal wiring / connectors
      category: cabling
      base_likelihood: 0.55
      hazardous: false
      recoverable: true

