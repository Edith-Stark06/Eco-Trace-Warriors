name: Frontend CI

on:
  workflow_dispatch:

  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint, Types, Format, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check — informational
        # P9.8: a real run found 161 pre-existing files not matching
        # Prettier's current config — accumulated with no prior CI gate
        # (this is the first frontend CI workflow at all). Not this
        # phase's scope to mass-reformat; informational until a dedicated
        # cleanup pass, rather than a blocking gate that fails on
        # unrelated pre-existing debt from day one.
        run: npm run format:check
        continue-on-error: true

      - name: Build
        # No automated frontend test suite exists yet (no Vitest/RTL
        # configured) — this workflow honestly mirrors what's real today:
        # lint/typecheck/format/build, not a fabricated test step.
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: ecotrace-frontend:ci
