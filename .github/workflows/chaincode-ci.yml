name: Chaincode CI

on:
  workflow_dispatch:

  push:
    branches: [develop, main]
    paths:
      - 'blockchain/chaincode/ecotrace-lifecycle/**'
      - '.github/workflows/chaincode-ci.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'blockchain/chaincode/ecotrace-lifecycle/**'
      - '.github/workflows/chaincode-ci.yml'

defaults:
  run:
    working-directory: blockchain/chaincode/ecotrace-lifecycle

jobs:
  quality:
    name: Lint, Build, Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/chaincode/ecotrace-lifecycle/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
